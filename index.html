<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15803d"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Súper Voz</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--tx:#14201a;--mu:#66756d;--ln:#dde4e0;--ac:#16a34a;--acx:#fff;--wa:#f59e0b;--bad:#dc2626;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1210;--card:#151f1b;--tx:#eaf3ee;--mu:#8da39a;--ln:#26352e;--ac:#22c55e;--acx:#04210f;--bad:#f87171;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1210;--card:#151f1b;--tx:#eaf3ee;--mu:#8da39a;--ln:#26352e;--ac:#22c55e;--acx:#04210f;--bad:#f87171;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 18px 10px;text-align:center}
header small{color:var(--mu);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#total{font-size:46px;font-weight:800;letter-spacing:-.02em}
#info{color:var(--mu);font-size:13px}
#list{flex:1;overflow-y:auto;padding:4px 14px 10px}
.empty{text-align:center;color:var(--mu);padding:40px 20px;font-size:14px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row .n{flex:1;min-width:0}.row .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n span{color:var(--mu);font-size:12px}
.row .s{font-weight:700;font-variant-numeric:tabular-nums}
.row button{border:0;background:none;color:var(--mu);font-size:20px;padding:4px 6px}
footer{padding:10px 12px 12px;background:var(--card);border-top:1px solid var(--ln)}
.bar{display:flex;gap:8px;align-items:center}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:13px 12px;width:100%;min-width:0}
input:focus{outline:2px solid var(--ac);border-color:transparent}
button{font:inherit;cursor:pointer}
.mic{width:56px;height:56px;flex:none;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font-size:24px}
.mic.on{animation:p 1s infinite;background:var(--bad);color:#fff}
@keyframes p{50%{transform:scale(1.1)}}
.sm{width:46px;height:46px;flex:none;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:18px}
.fin{height:46px;flex:none;padding:0 16px;border-radius:12px;border:0;background:var(--wa);color:#2a1a00;font-weight:800}
.hint{color:var(--mu);font-size:12px;margin:8px 2px 0;min-height:16px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.show{display:flex}
.box{background:var(--card);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.box h3{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.box h3 button{border:0;background:none;color:var(--mu);font-size:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.tot b{font-size:26px;color:var(--ok)}
.go{width:100%;padding:15px;border:0;border-radius:14px;background:var(--ac);color:var(--acx);font-weight:800;font-size:17px}
.ghost{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:none;color:var(--tx);margin-top:8px}
#diff{border-radius:12px;padding:12px;text-align:center;font-weight:700;margin:10px 0;display:none}
.big{font-size:42px;font-weight:800;text-align:center}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;display:none;z-index:20;max-width:90%;text-align:center}
#cur{display:none;background:var(--card);border-top:1px solid var(--ln);padding:10px 14px 8px}
#cur.show{display:block}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cn{min-width:0}.cn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cn span{color:var(--mu);font-size:13px}
.st{display:flex;align-items:center;gap:12px}
.st button{width:48px;height:48px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font-size:26px;font-weight:800;padding:0}
.st b{min-width:34px;text-align:center;font-size:26px}
.chips{display:flex;gap:8px;margin-top:8px}
.chips button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-weight:700}
.row.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
</style>
</head>
<body>
<header><small>Total del carrito</small><div id="total">$0</div><div id="info">Carrito vacío</div></header>
<div id="list"></div>
<div id="cur"><div class="ch"><div class="cn"><b id="cname"></b><span id="cinfo"></span></div>
  <div class="st"><button id="cm" aria-label="Menos">−</button><b id="cq">1</b><button id="cpl" aria-label="Más">+</button></div></div>
  <div class="chips"><button data-q="2">×2</button><button data-q="3">×3</button><button data-q="4">×4</button><button data-q="6">×6</button><button data-q="12">×12</button></div></div>
<footer>
  <div class="bar">
    <button class="mic" id="mic" aria-label="Hablar">🎤</button>
    <input id="q" placeholder="cerveza 1500" autocomplete="off" enterkeyhint="go">
    <button class="sm" id="undo" aria-label="Deshacer">↩</button>
    <button class="fin" id="fin">FINAL</button>
  </div>
  <div class="hint" id="hint">Decí «cerveza 1500». Después usá + / − o decí «por seis».</div>
</footer>

<div class="sheet" id="fs"><div class="box">
  <h3>Total final <button id="fx" aria-label="Cerrar">✕</button></h3>
  <div class="big" id="ft">$0</div>
  <div class="hint" id="fi" style="text-align:center"></div>
  <label style="margin-top:12px">¿Cuánto te cobra la caja? ($)</label>
  <div class="bar"><input id="fc" inputmode="decimal" placeholder="Total de la caja"><button class="sm" id="fmic" aria-label="Decir monto">🎤</button></div>
  <div id="diff"></div>
  <button class="ghost" id="copy">Copiar ticket</button>
  <button class="ghost" id="clear" style="color:var(--bad)">Vaciar y empezar otra compra</button>
</div></div>
<div id="toast"></div>

<script>
var KEY='supervoz_cart', cart=[], editId=null;
try{cart=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){cart=[]}
var $=function(i){return document.getElementById(i)};
var money=function(n){return '$'+n.toLocaleString('es-AR',{maximumFractionDigits:2})};
var save=function(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}};
var sum=function(){return cart.reduce(function(a,i){return a+i.price*i.qty},0)};
var units=function(){return cart.reduce(function(a,i){return a+i.qty},0)};

/* ---- números en texto y en palabras ---- */
var NW={cero:0,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900};
function noAcc(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function words2num(t){
  var w=noAcc(t.toLowerCase()).split(/\s+/).filter(Boolean),out=[],seq=false,cur=0,tot=0;
  function fl(){if(seq){out.push(String(tot+cur));seq=false;cur=0;tot=0}}
  for(var i=0;i<w.length;i++){var x=w[i];
    if(x in NW){seq=true;cur+=NW[x]}
    else if(x==='mil'){seq=true;tot+=(cur||1)*1000;cur=0}
    else if(x==='y'&&seq&&(w[i+1] in NW)){}
    else{fl();out.push(x)}}
  fl();return out.join(' ')}
function num(s){s=String(s||'').replace(/[$\s]/g,'');if(!s)return NaN;
  if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var v=parseFloat(s);return isFinite(v)?v:NaN}
function qty(s){var m=words2num(String(s||'')).replace(/[*x×]|\bpor\b/g,' ').match(/\d+/);var q=m?parseInt(m[0],10):NaN;return q>0?q:NaN}
function parse(raw){
  var t=words2num(raw).replace(/pesos?|\$/g,' '),q=1,m=t.match(/(?:\*|×|\bx\b|\bpor\b)\s*(\d+)/);
  if(m){q=parseInt(m[1],10)||1;t=t.replace(m[0],' ')}
  var ns=t.match(/\d[\d.]*(?:,\d+)?/g)||[],p=NaN;
  if(ns.length){var l=ns[ns.length-1];p=num(l);var k=t.lastIndexOf(l);t=t.slice(0,k)+' '+t.slice(k+l.length)}
  var n=t.replace(/\b(a|cuesta|sale)\b/g,' ').replace(/\s+/g,' ').trim();
  return{name:n.charAt(0).toUpperCase()+n.slice(1),price:p,qty:q}}

/* ---- avisos y voz ---- */
function toast(m){var e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2300)}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(btn,cb){
  if(!SR){toast('Tu navegador no tiene voz: usá Chrome');return}
  var r=new SR();r.lang='es-AR';r.interimResults=false;
  btn.classList.add('on');
  r.onresult=function(e){cb(e.results[0][0].transcript)};
  r.onerror=function(e){toast(e.error==='not-allowed'?'Permití el micrófono en el navegador':'No te escuché, probá de nuevo')};
  r.onend=function(){btn.classList.remove('on')};
  try{r.start()}catch(e){btn.classList.remove('on')}}

/* ---- lista ---- */
function render(){
  var L=$('list');L.textContent='';
  if(!cart.length){var d=document.createElement('div');d.className='empty';d.textContent='Todavía no cargaste nada.';L.appendChild(d)}
  cart.forEach(function(it){
    var r=document.createElement('div');r.className='row';
    var n=document.createElement('div');n.className='n';
    var b=document.createElement('b');b.textContent=it.name;
    var s=document.createElement('span');s.textContent='×'+it.qty+' · '+money(it.price)+' c/u';
    n.appendChild(b);n.appendChild(s);
    var st=document.createElement('div');st.className='s';st.textContent=money(it.price*it.qty);
    var x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','Quitar');
    x.onclick=function(e){e.stopPropagation();cart=cart.filter(function(c){return c.id!==it.id});if(curId===it.id)curId=null;render()};
    if(it.id===curId)r.className+=' sel';r.onclick=function(){curId=it.id;render()};
    r.appendChild(n);r.appendChild(st);r.appendChild(x);L.appendChild(r)});
  $('total').textContent=money(sum());
  $('info').textContent=cart.length?cart.length+' productos · '+units()+' unidades':'Carrito vacío';
  L.scrollTop=L.scrollHeight;renderCur();save()}

/* ---- producto actual y cantidad ---- */
var curId=null;
function cur(){return cart.filter(function(c){return c.id===curId})[0]}
function setQty(q){var it=cur();if(!it)return;
  if(q<1){cart=cart.filter(function(c){return c.id!==it.id});curId=null}else it.qty=q;render()}
function addItem(o){
  var it={id:Date.now()+Math.random().toString(36).slice(2,6),name:o.name||'Producto',price:o.price,qty:o.qty||1};
  cart.push(it);curId=it.id;render();toast(it.name+' agregado · '+money(it.price))}
function renderCur(){
  var it=cur(),box=$('cur');
  if(!it){box.classList.remove('show');return}
  box.classList.add('show');
  $('cname').textContent=it.name;
  $('cinfo').textContent=money(it.price)+' c/u = '+money(it.price*it.qty);
  $('cq').textContent=it.qty}

/* ---- entrada rápida ---- */
var isFinal=function(t){return /^(el )?(final|fin|total|terminar|termine|cerrar)$/.test(noAcc(t.trim().toLowerCase()))};
function quick(raw){
  raw=(raw||'').trim();if(!raw)return;
  $('hint').textContent='Entendí: «'+raw+'»';
  if(isFinal(raw)){openF();return}
  var m=words2num(raw).trim().toLowerCase().match(/^(\*|x|×|por)?\s*(\d+)$/);
  if(cur()&&m&&(m[1]||+m[2]<=99)){setQty(parseInt(m[2],10));$('q').value='';return}
  var p=parse(raw);
  if(isNaN(p.price)||p.price<=0){toast('No entendí el precio. Decí: «cerveza 1500»');$('q').value=raw;return}
  $('q').value='';addItem(p)}

/* ---- final ---- */
function openF(){
  $('ft').textContent=money(sum());
  $('fi').textContent=cart.length+' productos · '+units()+' unidades';
  $('fc').value='';$('diff').style.display='none';$('fs').classList.add('show')}
function diff(){
  var c=num($('fc').value),d=$('diff');if(isNaN(c)){d.style.display='none';return}
  var x=c-sum();d.style.display='block';
  if(Math.abs(x)<0.5){d.style.background='rgba(22,163,74,.15)';d.style.color='var(--ok)';d.textContent='✅ Coincide con la caja'}
  else if(x>0){d.style.background='rgba(220,38,38,.15)';d.style.color='var(--bad)';d.textContent='⚠️ La caja cobra '+money(x)+' de MÁS. Revisá el ticket.'}
  else{d.style.background='rgba(22,163,74,.15)';d.style.color='var(--ok)';d.textContent='La caja cobra '+money(-x)+' de menos que tu cuenta.'}}
function ticket(){
  return '🛒 Compra\n'+cart.map(function(i){return '• '+i.name+' ×'+i.qty+' → '+money(i.price*i.qty)}).join('\n')+'\nTOTAL: '+money(sum())}

/* ---- eventos ---- */
$('mic').onclick=function(){listen($('mic'),quick)};
$('q').addEventListener('keydown',function(e){if(e.key==='Enter')quick(e.target.value)});
$('undo').onclick=function(){if(!cart.length){toast('No hay nada para deshacer');return}var i=cart.pop();if(curId===i.id)curId=null;render();toast('Quitado: '+i.name)};
$('fin').onclick=openF;
$('cm').onclick=function(){var it=cur();if(it)setQty(it.qty-1)};
$('cpl').onclick=function(){var it=cur();if(it)setQty(it.qty+1)};
Array.prototype.forEach.call(document.querySelectorAll('.chips button'),function(b){b.onclick=function(){setQty(parseInt(b.dataset.q,10))}});
$('fx').onclick=function(){$('fs').classList.remove('show')};
$('fc').oninput=diff;
$('fmic').onclick=function(){listen($('fmic'),function(t){var v=num(words2num(t).replace(/pesos?/g,''));if(isNaN(v)){toast('No entendí el monto: «'+t+'»');return}$('fc').value=v;diff()})};
$('copy').onclick=function(){
  if(!cart.length){toast('El carrito está vacío');return}
  var t=ticket();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Ticket copiado')},function(){prompt('Copiá el ticket:',t)});
  else prompt('Copiá el ticket:',t)};
$('clear').onclick=function(){if(confirm('¿Vaciar el carrito y empezar otra compra?')){cart=[];render();$('fs').classList.remove('show')}};
if(!SR){['mic','fmic'].forEach(function(i){$(i).style.display='none'});$('hint').textContent='Escribí: «cerveza 1500» y Enter. Para voz usá Chrome.'}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
